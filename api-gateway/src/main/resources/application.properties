spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webflux.routes[0].id=productos-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://productos-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/productos/**

spring.cloud.gateway.server.webflux.routes[1].id=usuarios-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://usuarios-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/usuarios/**

spring.cloud.gateway.server.webflux.routes[2].id=ventas-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ventas-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/ventas/**
