spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.urls[0].name=Productos Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/productos

springdoc.swagger-ui.urls[1].name=Usuarios Service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/usuarios

springdoc.swagger-ui.urls[2].name=Ventas Service
springdoc.swagger-ui.urls[2].url=/v3/api-docs/ventas


# Rutas REST: Productos
spring.cloud.gateway.server.webflux.routes[0].id=productos-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://productos-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/productos/**


# Rutas REST: Usuarios
spring.cloud.gateway.server.webflux.routes[1].id=usuarios-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://usuarios-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/usuarios/**


# Rutas REST: Ventas
spring.cloud.gateway.server.webflux.routes[2].id=ventas-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ventas-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/ventas/**


# Swagger: Productos
spring.cloud.gateway.server.webflux.routes[3].id=productos-openapi
spring.cloud.gateway.server.webflux.routes[3].uri=lb://productos-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/v3/api-docs/productos
spring.cloud.gateway.server.webflux.routes[3].filters[0]=SetPath=/v3/api-docs


# Swagger: Usuarios
spring.cloud.gateway.server.webflux.routes[4].id=usuarios-openapi
spring.cloud.gateway.server.webflux.routes[4].uri=lb://usuarios-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/v3/api-docs/usuarios
spring.cloud.gateway.server.webflux.routes[4].filters[0]=SetPath=/v3/api-docs


# Swagger: Ventas
spring.cloud.gateway.server.webflux.routes[5].id=ventas-openapi
spring.cloud.gateway.server.webflux.routes[5].uri=lb://ventas-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/v3/api-docs/ventas
spring.cloud.gateway.server.webflux.routes[5].filters[0]=SetPath=/v3/api-docs